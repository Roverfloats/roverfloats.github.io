name: Update Tasks at Midnight

on:
  push:
    branches:
        - main
  schedule:
    - cron: "56 14 * * *"   #UTC
  workflow_dispatch:      # Allows manual run from UI

jobs:
  run-task:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node auto-functions/UpdateTasks.js